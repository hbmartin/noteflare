name: Platform archive retention
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-archive-retention
  cancel-in-progress: false
jobs:
  expire:
    if: vars.BASIN_RETENTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: platform-retention
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-platform-retention.txt
      - run: python -m pip install -r requirements-platform-retention.txt
      - run: python scripts/platform_retention_test.py
      - run: python scripts/platform-retention.py
        env:
          BASIN_CATALOG_URI: ${{ vars.BASIN_CATALOG_URI }}
          BASIN_WAREHOUSE: ${{ vars.BASIN_WAREHOUSE }}
          BASIN_AUDIT_TABLE: ${{ vars.BASIN_AUDIT_TABLE }}
          BASIN_HEATMAP_TABLE: ${{ vars.BASIN_HEATMAP_TABLE }}
          BASIN_CATALOG_TOKEN: ${{ secrets.BASIN_CATALOG_TOKEN }}
